# Push a tag like v0.1.0 to build and publish a GitHub release with two zips, each with the Windows and the
# Linux build side by side:
#   Oxidizer-<version>.zip           standalone Oxidizer (an Oxidizer/ folder with oxidizer.exe and oxidizer)
#   Oxidizer.StarMap-<version>.zip   Oxidizer as a StarMap mod (an Oxidizer.StarMap/ folder for mods/)
# Why not per-platform zips: the content index wants every launch file in the main archive and in each
# <stem>-<platform>.zip too. Why these names: with two zips in one release, the index takes the one named
# <listing id>-<version>.zip for each listing.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # manual run: builds both zips as artifacts, publishes nothing

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            exe: oxidizer.exe
            core: oxidizer_core.dll
            modlib: hello_rust.dll
          - os: ubuntu-latest
            exe: oxidizer
            core: liboxidizer_core.so
            modlib: libhello_rust.so
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: |
          dotnet build bridge -c Release -o target/bridge
          cargo build --release --workspace

      - name: Package
        shell: pwsh
        run: |
          $d = "dist/Oxidizer"
          New-Item -ItemType Directory -Force "$d/bridge", "$d/example-mods/hello_rust/bin", "$d/example-mods/hello_rhai" | Out-Null
          Copy-Item target/release/${{ matrix.exe }}, README.md, LICENSE, CHANGELOG.md $d
          & ($IsWindows ? "python" : "python3") scripts/notices.py "$d/THIRD-PARTY-NOTICES.txt"
          if ($LASTEXITCODE) { exit 1 }
          Copy-Item target/bridge/0Harmony.dll, target/bridge/Oxidizer.Bridge.dll "$d/bridge"
          Copy-Item examples/hello_rust/mod.toml "$d/example-mods/hello_rust"
          Copy-Item target/release/${{ matrix.modlib }} "$d/example-mods/hello_rust/bin"
          Copy-Item examples/hello_rhai/* "$d/example-mods/hello_rhai"

          # The StarMap mod: no 0Harmony.dll (StarMap has its own) and no StarMap.API (StarMap provides it).
          $m = "dist/Oxidizer.StarMap"
          New-Item -ItemType Directory -Force $m | Out-Null
          Copy-Item starmap/mod.toml, target/bridge/Oxidizer.Bridge.dll, target/release/${{ matrix.core }}, LICENSE, "$d/THIRD-PARTY-NOTICES.txt" $m

      # Tar keeps the Linux executable bit through the artifact upload; the release job zips.
      - name: Archive
        shell: bash
        run: tar -cf "dist-${{ runner.os }}.tar" -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}
          path: dist-${{ runner.os }}.tar

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Release notes are the tag's section of CHANGELOG.md; no section, no release.
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          $c = (Get-Content CHANGELOG.md -Raw) -replace "`r", ""
          if ($c -notmatch "(?ms)^## \[$([regex]::Escape($v))\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]: |\z)") {
            throw "CHANGELOG.md has no section for $v"
          }
          $Matches[1].Trim() | Set-Content notes.md

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      # Both platforms unpacked into one tree, then one zip per folder.
      - name: Zips
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir both
          tar -xf dist-Windows.tar -C both
          tar -xf dist-Linux.tar -C both
          cd both
          zip -qr "../Oxidizer-$version.zip" Oxidizer
          zip -qr "../Oxidizer.StarMap-$version.zip" Oxidizer.StarMap

      - name: Zips (manual run)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: zips
          path: "*.zip"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "Oxidizer-$version.zip" "Oxidizer.StarMap-$version.zip" --title "Oxidizer $GITHUB_REF_NAME" --notes-file notes.md
