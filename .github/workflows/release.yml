# Push a tag like v0.1.0 to build and publish a GitHub release.
# The release has one zip, Oxidizer-<tag>.zip, with the Windows and the Linux build side by side.
# One zip on purpose: the content index wants every launch file (oxidizer.exe and oxidizer) in the
# main archive, and in any <stem>-<platform>.zip as well, so per-platform zips would only be copies.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # manual run: builds both zips as artifacts, publishes nothing



permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            suffix: "-windows"
            exe: oxidizer.exe
            modlib: hello_rust.dll
          - os: ubuntu-latest
            suffix: "-linux"
            exe: oxidizer
            modlib: libhello_rust.so
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: |
          dotnet build bridge -c Release -o target/bridge
          cargo build --release --workspace

      - name: Package
        shell: pwsh
        run: |
          $d = "dist/Oxidizer"
          New-Item -ItemType Directory -Force "$d/bridge", "$d/example-mods/hello_rust", "$d/example-mods/hello_rhai" | Out-Null
          Copy-Item target/release/${{ matrix.exe }}, README.md, LICENSE, CHANGELOG.md $d
          & ($IsWindows ? "python" : "python3") scripts/notices.py "$d/THIRD-PARTY-NOTICES.txt"
          if ($LASTEXITCODE) { exit 1 }
          Copy-Item target/bridge/0Harmony.dll, target/bridge/Oxidizer.Bridge.dll "$d/bridge"
          Copy-Item examples/hello_rust/mod.toml, target/release/${{ matrix.modlib }} "$d/example-mods/hello_rust"
          Copy-Item examples/hello_rhai/* "$d/example-mods/hello_rhai"

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive dist/Oxidizer "Oxidizer-${{ github.ref_name }}${{ matrix.suffix }}.zip"

      - name: Zip (Linux, keeps the executable bit)
        if: runner.os == 'Linux'
        run: cd dist && zip -qr "../Oxidizer-${{ github.ref_name }}${{ matrix.suffix }}.zip" Oxidizer

      - uses: actions/upload-artifact@v4
        with:
          name: zip-${{ matrix.os }}
          path: Oxidizer-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Release notes are the tag's section of CHANGELOG.md; no section, no release.
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          $c = (Get-Content CHANGELOG.md -Raw) -replace "`r", ""
          if ($c -notmatch "(?ms)^## \[$([regex]::Escape($v))\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]: |\z)") {
            throw "CHANGELOG.md has no section for $v"
          }
          $Matches[1].Trim() | Set-Content notes.md

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      # Both platform zips unpacked into one Oxidizer/ folder; unzip keeps the Linux executable bit.
      - name: Combined zip
        run: |
          mkdir both
          unzip -q "Oxidizer-${{ github.ref_name }}-windows.zip" -d both
          unzip -qo "Oxidizer-${{ github.ref_name }}-linux.zip" -d both
          cd both && zip -qr "../Oxidizer-${{ github.ref_name }}.zip" Oxidizer

      - name: Combined zip (manual run)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: zip-combined
          path: Oxidizer-${{ github.ref_name }}.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "Oxidizer-${{ github.ref_name }}.zip" --title "Oxidizer ${{ github.ref_name }}" --notes-file notes.md
