# Builds the modding guide in book/ with MkDocs (Material theme) and publishes it to GitHub Pages:
# https://oxidizer.safeshows.dev/
name: docs

on:
  push:
    branches: [master]
    paths: ["book/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build
        run: |
          pip install mkdocs-material==9.8.1
          mkdocs build --strict -f book/mkdocs.yml
      - uses: actions/upload-pages-artifact@v5
        with:
          path: book/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
